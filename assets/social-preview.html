<!doctype html>
<meta charset="utf-8">
<style>
  :root { color-scheme: light; }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 640px; display: flex; flex-direction: column;
    justify-content: space-between; padding: 72px 80px;
    background: linear-gradient(160deg, #ffffff 0%, #fff5fb 55%, #ffe9f6 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    color: #151515;
  }
  .eyebrow { font-size: 22px; letter-spacing: .18em; text-transform: uppercase; color: #ff0098; font-weight: 600; }
  h1 { font-size: 92px; line-height: 1.02; letter-spacing: -.03em; font-weight: 700; margin-top: 26px; max-width: 16ch; }
  p { font-size: 30px; line-height: 1.35; color: #5b5b5b; margin-top: 26px; max-width: 30ch; }
  .rule { height: 8px; width: 132px; background: #ff0098; border-radius: 99px; margin-top: 34px; }
  footer { display: flex; align-items: flex-end; justify-content: space-between; }
  .site { font-size: 30px; font-weight: 600; }
  .site span { color: #ff0098; }
  .chains { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; max-width: 520px; }
  .chip { font-size: 19px; padding: 9px 16px; border-radius: 99px; background: #ffffff; border: 1px solid #f0d7e8; color: #4a4a4a; }
</style>
<body>
  <div>
    <div class="eyebrow">Open handbook</div>
    <h1>Token Launch Handbook</h1>
    <p>Everything to decide before you create a token — and how to manage it afterwards.</p>
    <div class="rule"></div>
  </div>
  <footer>
    <div class="site">unilaunch<span>.online</span></div>
    <div class="chains">
      <div class="chip">Solana</div><div class="chip">Ethereum</div><div class="chip">Base</div>
      <div class="chip">BNB Chain</div><div class="chip">Polygon</div><div class="chip">Arbitrum</div>
      <div class="chip">Avalanche</div><div class="chip">+2</div>
    </div>
  </footer>
</body>
